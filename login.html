    <h1>Bentornato</h1>
    <p class="lede">Accedi al tuo account Gaming Relax.</p>

    <p class="auth-error" id="login-error"></p>

    <!-- Pulsante Accesso con Google -->
    <button type="button" id="google-login-btn" class="btn btn--outline" style="width: 100%; display: flex; align-items: center; justify-content: center; gap: 10px; margin-bottom: 20px;">

      <div style="flex: 1; border-bottom: 1px solid var(--border);"></div>
      <span style="padding: 0 10px;">oppure con email</span>
      <div style="flex: 1; border-bottom: 1px solid var(--border);"></div>
    </div>

    <form id="login-form">
      <div class="field">
        <label for="login-email">Email</label>
        <input type="email" id="login-email" name="email" required autocomplete="email">
      </div>
      <div class="field">
        <label for="login-password">Password</label>
        <input type="password" id="login-password" name="password" required autocomplete="current-password">
      </div>
      <button type="submit" class="btn btn--lime">Accedi</button>
    </form>

    <p class="auth-forgot"><button type="button" id="forgot-toggle">Password dimenticata?</button></p>
    <div id="forgot-wrap" style="display:none;margin-top:8px;">
      <p id="forgot-msg"></p>
      <form id="forgot-form">
        <div class="field">
          <label for="forgot-email">Email dell'account</label>
          <input type="email" id="forgot-email" name="forgot-email" autocomplete="email" placeholder="la tua email">
        </div>
        <button type="submit" class="btn btn--outline" style="width:100%;justify-content:center;">Invia link di reset</button>
      </form>
    </div>

    <p class="auth-switch">Non hai un account? <a href="register.html">Registrati</a></p>
