<div class="auth-page">
  <div class="auth-card">
    <h1>Crea account</h1>
    <p class="lede">Registrati per seguire i tuoi ordini e le tue richieste.</p>

    <p class="auth-error" id="register-error"></p>
    <p class="auth-ok" id="register-ok"></p>

    <form id="register-form">
      <div class="field">
        <label for="register-nickname">Nickname <span style="color:var(--text-dim);font-weight:400;">(verrà mostrato nel forum e sul sito)</span></label>
        <input type="text" id="register-nickname" name="nickname" required autocomplete="username" minlength="2" maxlength="24" placeholder="Es. DarkKnight92">
      </div>
      <div class="field">
        <label for="register-email">Email</label>
        <input type="email" id="register-email" name="email" required autocomplete="email" placeholder="es. mario@gmail.com">
        <p style="font-size:12px;color:var(--text-dim);margin:8px 0 0;">Ti inviamo un link di conferma. Senza conferma l'account non si attiva: così nessuno può registrarsi con un'email a caso.</p>
      </div>
      <div class="field">
        <label for="register-password">Password</label>
        <input type="password" id="register-password" name="password" required autocomplete="new-password" minlength="6">
      </div>
      <button type="submit" class="btn btn--lime">Registrati</button>
    </form>

    <p class="auth-switch">Hai già un account? <a href="login.html">Accedi</a></p>
  </div>
</div>
