<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Registrati — Gaming Relax</title>
<link rel="icon" type="image/x-icon" href="images/favicon.ico">
<link rel="icon" type="image/png" sizes="32x32" href="images/favicon-32.png">
<link rel="apple-touch-icon" href="images/apple-touch-icon.png">

<meta property="og:type" content="website">
<meta property="og:site_name" content="Gaming Relax">
<meta property="og:title" content="Registrati — Gaming Relax">
<meta property="og:description" content="Crea il tuo account Gaming Relax.">
<meta property="og:image" content="https://gamingrelaxofficials.it/images/og-image.jpg">
<meta property="og:url" content="https://gamingrelaxofficials.it/register.html">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Registrati — Gaming Relax">
<meta name="twitter:description" content="Crea il tuo account Gaming Relax.">
<meta name="twitter:image" content="https://gamingrelaxofficials.it/images/og-image.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body data-page="register">

<header class="site-header">
  <div class="container">
    <a href="index.html" class="brand">
      <span class="brand__logo"><img src="images/logo.png" alt="Gaming Relax logo"></span>
      Gaming Relax
    </a>
    <div class="header-actions">
      <span id="auth-area"></span>
    </div>
  </div>
</header>

<div class="auth-page">
  <div class="auth-card">
    <h1>Crea account</h1>
    <p class="lede">Registrati per seguire i tuoi ordini e le tue richieste.</p>

    <p class="auth-error" id="register-error"></p>

    <form id="register-form">
      <div class="field">
        <label for="register-name">Nome / Alias</label>
        <input type="text" id="register-name" name="name" autocomplete="name">
      </div>
      <div class="field">
        <label for="register-email">Email</label>
        <input type="email" id="register-email" name="email" required autocomplete="email">
      </div>
      <div class="field">
        <label for="register-password">Password</label>
        <input type="password" id="register-password" name="password" required autocomplete="new-password" minlength="6">
      </div>
      <button type="submit" class="btn btn--lime">Registrati</button>
    </form>

    <p class="auth-switch">Hai già un account? <a href="login.html">Accedi</a></p>
  </div>
</div>

<script type="module" src="js/firebase-init.js"></script>
<script type="module" src="js/auth.js"></script>
<script src="js/script.js"></script>
</body>
</html>
