<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="dark">
<title>Dashboard — Gaming Relax</title>
<style>
html,body{margin:0;background:#05070e;color:#e8ecf2;font-family:system-ui,sans-serif;min-height:100%}
#boot{min-height:70vh;display:flex;align-items:center;justify-content:center;text-align:center;padding:28px}
#boot a{color:#ff4dad}
</style>
</head>
<body data-page="dashboard">
<div id="boot"><p>Caricamento Dashboard…</p></div>
<script>
(async function () {
  var boot = document.getElementById('boot');
  try {
    var parts = [];
    for (var i = 0; i < 4; i++) {
      var r = await fetch('dashboard-chunk-' + i + '.txt?v=20261026f', { cache: 'no-store' });
      if (!r.ok) throw new Error('chunk ' + i + ' HTTP ' + r.status);
      parts.push(await r.text());
    }
    var html = parts.join('');
    if (html.indexOf('dashboard-root') === -1) throw new Error('HTML incompleto');
    document.open();
    document.write(html);
    document.close();
  } catch (err) {
    boot.innerHTML = '<p>Errore: ' + (err && err.message ? err.message : err) + '</p><p><a href="dashboard.html">Riprova</a> · <a href="login.html">Login</a></p>';
  }
})();
</script>
</body>
</html>
