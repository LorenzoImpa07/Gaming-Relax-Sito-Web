<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="color-scheme" content="dark">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard — Gaming Relax</title>
<link rel="icon" type="image/x-icon" href="images/favicon.ico">
<link rel="stylesheet" href="css/style.css?v=20261026b">
<link rel="stylesheet" href="css/dashboard-pro.css?v=20261026b">
<link rel="stylesheet" href="css/gaming-polish.css?v=20261025a">
<style>
html,body{background:#05070e!important;color-scheme:dark;margin:0;min-height:100%;}
.dashboard-guard{min-height:60vh;display:flex;align-items:center;justify-content:center;color:#e8ecf2;font-family:Inter,system-ui,sans-serif;text-align:center;padding:24px;}
.dashboard-guard a{color:#ff4dad;}
#dashboard-root{display:none;}
</style>
</head>
<body data-page="dashboard">
<header class="site-header">
  <div class="container" style="display:flex;align-items:center;justify-content:space-between;padding:12px 16px;">
    <a href="index.html" class="brand" style="display:flex;align-items:center;gap:10px;text-decoration:none;color:#fff;">
      <img src="images/logo.png" alt="Gaming Relax" width="40" height="40" style="border-radius:10px;">
      <span>Gaming Relax</span>
    </a>
    <span id="auth-area"></span>
  </div>
</header>
<div class="dashboard-guard" id="dashboard-guard">
  <p>Verifica accesso in corso…</p>
</div>
<div id="dashboard-root" style="display:none;padding:20px;color:#fff;font-family:Inter,system-ui,sans-serif;">
  <p>Caricamento pannello… Se non parte, <a href="login.html" style="color:#ff4dad">accedi di nuovo</a>.</p>
  <p id="admin-email"></p>
  <a id="dash-open-site" href="index.html" style="color:#ff4dad">Apri il sito</a>
  <button id="logout-dash" type="button">Esci</button>
  <div class="dash-main container"></div>
</div>
<script src="js/dash-guard-boot.js?v=20261026b"></script>
<script type="module" src="js/firebase-init.js?v=20261026b"></script>
<script type="module" src="js/auth.js?v=20261026b"></script>
<script type="module" src="js/dashboard.js?v=20261026b"></script>
<script src="js/dashboard-ui-pro.js?v=20261025d" defer></script>
</body>
</html>
