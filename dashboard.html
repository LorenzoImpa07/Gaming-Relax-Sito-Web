<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="dark">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Dashboard Admin — Gaming Relax</title>
<style>
  html,body{margin:0;background:#05070e;color:#e8ecf2;font-family:system-ui,-apple-system,sans-serif;min-height:100%;}
  .wrap{max-width:560px;margin:0 auto;padding:40px 20px;text-align:center;}
  .logo{width:56px;height:56px;border-radius:14px;object-fit:cover;margin-bottom:16px;}
  h1{font-size:24px;margin:0 0 8px;color:#fff;}
  p{color:#a0a8b8;line-height:1.5;margin:0 0 16px;}
  .box{margin-top:28px;padding:24px;border-radius:18px;border:1px solid rgba(255,77,173,.35);background:rgba(18,16,36,.95);}
  .btn{display:inline-block;margin:8px 6px;padding:14px 22px;border-radius:999px;font-weight:700;text-decoration:none;border:none;cursor:pointer;font-size:15px;}
  .btn-pink{background:#ff4dad;color:#0a0d16;}
  .btn-out{background:transparent;color:#ff4dad;border:1px solid rgba(255,77,173,.5);}
  #status{min-height:24px;margin-top:12px;font-size:14px;color:#c8cdd8;}
  .ok{color:#86efac;}
  .err{color:#ff8fab;}
</style>
</head>
<body>
  <div class="wrap">
    <img class="logo" src="images/logo.png" alt="Gaming Relax" onerror="this.style.display='none'">
    <h1>Dashboard Admin</h1>
    <p>Gaming Relax — pannello di controllo</p>

    <div class="box">
      <p id="status">Controllo accesso…</p>
      <div id="actions" style="display:none"></div>
    </div>

    <p style="margin-top:28px;font-size:13px">
      <a href="index.html" style="color:#ff4dad">← Torna al sito</a>
    </p>
  </div>

  <!-- NESSUN modulo esterno qui: questo script non può bloccare la pagina -->
  <script>
  (function () {
    var status = document.getElementById("status");
    var actions = document.getElementById("actions");

    function show(msg, html, ok) {
      status.innerHTML = msg;
      status.className = ok ? "ok" : "err";
      if (html) {
        actions.style.display = "block";
        actions.innerHTML = html;
      }
    }

    // Dopo 2 secondi, SEMPRE un'azione (login o ricarica) — mai più blocco infinito
    setTimeout(function () {
      if (actions.style.display === "block") return;
      show(
        "Accesso non confermato. Accedi come amministratore.",
        '<a class="btn btn-pink" href="login.html">Vai al login</a>' +
          '<a class="btn btn-out" href="dashboard.html?t=' + Date.now() + '">Ricarica</a>'
      );
    }, 2000);

    // Prova auth Firebase in modo non bloccante
    var s1 = document.createElement("script");
    s1.type = "module";
    s1.textContent =
      'import { auth, ADMIN_EMAIL, authReady } from "./js/firebase-init.js?v=20261028c\x3b\x22;\n' +
      'import { onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js\x3b\x22;\n' +
      'try { await authReady; } catch (e) {}\n' +
      'onAuthStateChanged(auth, (user) => {\n' +
      '  const status = document.getElementById("status\x3b\x22);\n' +
      '  const actions = document.getElementById("actions\x3b\x22);\n' +
      '  const admin = String(ADMIN_EMAIL || "").trim().toLowerCase();\n' +
      '  const email = user && user.email ? String(user.email).trim().toLowerCase() : "";\n' +
      '  if (!user) {\n' +
      '    status.textContent = "Devi accedere con l\x27account amministratore.";\n' +
      '    status.className = "err";\n' +
      '    actions.style.display = "block";\n' +
      '    actions.innerHTML = \x27<a class="btn btn-pink" href="login.html">Vai al login</a>\x27;\n' +
      '    return;\n' +
      '  }\n' +
      '  if (email !== admin) {\n' +
      '    status.textContent = "Questo account non è amministratore: " + (user.email || "");\n' +
      '    status.className = "err";\n' +
      '    actions.style.display = "block";\n' +
      '    actions.innerHTML = \x27<a class="btn btn-out" href="index.html">Torna al sito</a>\x27;\n' +
      '    return;\n' +
      '  }\n' +
      '  status.innerHTML = "Accesso admin OK: <strong style=\\"color:#ff4dad\\">" + user.email + "</strong>";\n' +
      '  status.className = "ok";\n' +
      '  actions.style.display = "block";\n' +
      '  actions.innerHTML = \x27<a class="btn btn-pink" href="index.html">Apri il sito</a>\x27 +
      '    \x27<button class="btn btn-out" id="dash-out" type="button">Esci</button>\x27 +
      '    \x27<p style="margin-top:18px;font-size:13px;color:#a0a8b8">Pannelli completi: ripristina dashboard.html dal commit df2fc28d su GitHub (History → Restore).</p>\x27 +
      '    \x27<p><a href="https://github.com/LorenzoImpa07/Gaming-Relax-Sito-Web/commits/main/dashboard.html" style="color:#ff4dad">Apri History GitHub</a></p>\x27;\n' +
      '  document.getElementById("dash-out")?.addEventListener("click", () => signOut(auth).then(() => location.href = "index.html"));\n' +
      '});\n';
    // The above escaped module is error-prone. Use external small file instead.
  })();
  </script>
  <script type="module" src="js/dash-access.js?v=20261028c"></script>
</body>
</html>
